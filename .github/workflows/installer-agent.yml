---
name: installer-agent

on:
  pull_request:
    paths:
      - "installer/**"
  push:
    branches: [master]
    paths:
      - "installer/**"

permissions:
  contents: read

jobs:
  unit:
    name: installer unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile package
        run: python -m compileall -q installer/pasevsu_installer

      - name: Unit tests
        run: python -m unittest discover -s installer/tests -t installer -v
